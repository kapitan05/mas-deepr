[project]
name = "mas-deepr"
version = "0.1.0"
description = "Multi-agent SLM deep-research stack: MAF topology, DSPy prompt compilation, GRPO training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.11.0",
    "agent-framework-openai>=1.10.1",
    "aiolimiter>=1.3.0",
    "crawl4ai>=0.9.4",
    "dspy>=3.2.1",
    "fastmcp>=4.0.10",
    "httpx>=0.28.1",
    "huggingface-hub>=1.24.0",
    "matplotlib>=3.11.2",
    "openai>=2.46.0",
    "polars>=1.42.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "tavily-python>=0.7.26",
    "tenacity>=9.1.4",
    "trafilatura>=2.1.0",
    "wandb>=0.30.0",
]

[project.optional-dependencies]
rl-art = [
    "openpipe-art>=0.5.20",
    "peft>=0.21.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "trl>=1.14.1",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

# Verbatim-preserved external template text (OpenAI simple-evals grader prompt).
[tool.ruff.lint.per-file-ignores]
"src/mas_deepr/evals/judge.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = [
    "trafilatura.*",
    "tavily.*",
    "agent_framework.*",
    "datasets.*",
    "crawl4ai.*",
]
ignore_missing_imports = true
follow_untyped_imports = true

# dspy.Signature's dynamic pydantic-metaclass machinery isn't statically
# typeable; following its untyped source (as above) surfaces a spurious
# metaclass-conflict error on every Signature subclass, so treat it as Any.
[[tool.mypy.overrides]]
module = ["dspy.*"]
ignore_missing_imports = true

# rl-art extra (torch/transformers/trl/peft/openpipe-art) -- optional,
# deliberately NOT installed by CI (too heavy for its time budget, and
# pytest's own `addopts = "-m 'not art'"` already skips tests needing a
# real install). Without this override, CI's mypy run can't resolve these
# imports at all -- confirmed live 2026-09-29, this was the actual cause
# of 51 CI-only mypy errors (import-not-found, plus two downstream
# cascades: rl/rollout.py's ArtMessage-based type alias, and several
# `# type: ignore` comments in test_rollout.py flagged "unused" once the
# expressions they guard become untyped Any instead of art's real types).
[[tool.mypy.overrides]]
module = ["art.*", "torch.*", "transformers.*", "trl.*", "peft.*"]
ignore_missing_imports = true

# tests/test_rollout.py's `# type: ignore[...]` comments suppress real
# type errors only when checked against art's *real* types (rl-art extra
# installed) -- under the override above (CI's default, no rl-art extra),
# those expressions become untyped Any and the same comments are flagged
# "unused" instead. Scoped to this one file, not the project-wide
# warn_unused_ignores setting, since every other file's ignores stay
# meaningful either way.
[[tool.mypy.overrides]]
module = ["test_rollout"]
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not art'"
markers = [
    "art: needs the optional openpipe-art extra (`uv sync --extra rl-art`). Importing `art` monkeypatches transformers.masking_utils globally (confirmed: breaks plain-transformers forward passes for the rest of the process) -- run these in their own process, never mixed into the default suite. `uv run pytest tests/ -m art`.",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.22",
    "types-pyyaml>=6.0.12.20260724",
]
